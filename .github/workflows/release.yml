name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-pkg
          key: zig-release-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-

      - run: zig fmt --check src tools build.zig

      - run: zig build test --test-timeout 2000ms

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx --yes \
            --package=semantic-release@^24 \
            --package=@semantic-release/exec@^7 \
            --package=@semantic-release/git@^10 \
            -- semantic-release
